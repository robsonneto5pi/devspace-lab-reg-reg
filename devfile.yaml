schemaVersion: 2.2.0
metadata:
  name: devspace-lab-reg-reg
attributes:
  controller.devfile.io/storage-type: ephemeral

projects:
  - name: calculadora-rtc-regime-regular
    git:
      remotes:
        origin: 'https://github.com/ReceitaFederal/calculadora-rtc-regime-regular.git'
      checkoutFrom:
        revision: main

components:
  - name: udi
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryLimit: 4Gi
      memoryRequest: 512Mi
      cpuLimit: "2"
      cpuRequest: 100m
      mountSources: true
      sourceMapping: /projects
      env:
        - name: SERVER_PORT
          value: "8081"
      endpoints:
        - exposure: public
          name: calculadora-api
          protocol: https
          targetPort: 8081

  - name: ramalama
    attributes:
      container-overrides:
        resources:
          limits:
            cpu: "2"
            memory: 8Gi
          requests:
            cpu: 200m
            memory: 4Gi
    container:
      image: quay.io/ramalama/ramalama:latest
      env:
        - name: HOME
          value: /models
      args:
        - "ramalama"
        - "--nocontainer"
        - "--store"
        - "/models"
        - "serve"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8080"
        - "ollama://qwen2.5-coder:7b"
      volumeMounts:
        - name: ramalama-models
          path: /models

  - name: ramalama-models
    volume:
      size: 12Gi

commands:
  - id: setup
    exec:
      component: udi
      commandLine: "mkdir -p /home/user/.continue && curl -fsSL https://raw.githubusercontent.com/remingtonsb/cde-ramalama-continue/master/continue-config.yaml -o /home/user/.continue/config.yaml && sed -i 's/qwen2\\.5-coder:3b/qwen2.5-coder:7b/g' /home/user/.continue/config.yaml && echo OK"

  - id: setup-java21
    exec:
      component: udi
      commandLine: "source ~/.sdkman/bin/sdkman-init.sh 2>/dev/null; sdk install java 21.0.13.0+9-tem 2>/dev/null; sdk default java 21.0.13.0+9-tem 2>/dev/null; java -version"

  - id: verify-java
    exec:
      component: udi
      commandLine: "cd /projects/calculadora-rtc-regime-regular && java -version && ./mvnw --version"

  - id: migrate-db
    exec:
      component: udi
      commandLine: "cd /projects/calculadora-rtc-regime-regular && mkdir -p ./calculadora/db && ./mvnw flyway:migrate -Dflyway.configFiles=./flyway/flyway-pro.conf --batch-mode --errors"

  - id: test
    exec:
      component: udi
      commandLine: "cd /projects/calculadora-rtc-regime-regular && ./mvnw clean test jacoco:report"

  - id: run-offline
    exec:
      component: udi
      commandLine: "cd /projects/calculadora-rtc-regime-regular && ./mvnw spring-boot:run -Dspring-boot.run.profiles=offline"

events:
  postStart:
    - setup